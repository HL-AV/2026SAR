<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background-color: #f4f7f9; color: #333; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .record-card { background: #f8f9fa; padding: 18px; border-radius: 8px; border-left: 5px solid #1a73e8; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .record-card p { margin: 6px 0; font-size: 14.5px; display: flex; justify-content: space-between; border-bottom: 1px dashed #eef0f2; padding-bottom: 4px; }
        .highlight { color: #d93025; font-weight: bold; font-size: 16px; }
        .summary-info { text-align: center; font-weight: bold; color: #5f6368; margin-bottom: 15px; }
    </style>
</head>

    function searchData() {
        const name = document.getElementById('userName').value.trim();
        const birth = document.getElementById('userBirth').value.trim();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "";

        const matches = data.filter(p => p.name === name && p.birth === birth);

        if (matches.length > 0) {
            let html = `<div class="summary-info">총 ${matches.length}건의 실적이 확인되었습니다.</div>`;
            matches.forEach((item, index) => {
                html += `
                    <div class="record-card">
                        <p><strong>[데이터 ${index + 1}]</strong></p>
                        <p><span>근무일</span> <b>${item.days}일</b></p>
                        <p><span>매출금액</span> <b>${item.sales}원</b></p>
                        <p><span>목표금액</span> <b>${item.target}원</b></p>
                        <p><span>매출 달성률</span> <span class="highlight">${item.rate}</span></p>
                        <p><span>품목 판매량</span> <b>${item.itemQty}개</b></p>
                        <p><span>품목 달성률</span> <b>${item.itemRate}</b></p>
                    </div>`;
            });
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = "<p style='text-align:center; color:#e74c3c;'>일치하는 정보를 찾을 수 없습니다.</p>";
        }
    }

</html>
