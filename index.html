<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실적 상세 조회</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            font-family: 'Pretendard', sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }
        .line {
            height: 4px;
            background-color: #1a73e8;
            border-radius: 2px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        #result {
            margin-top: 25px;
            display: none;
        }
        .card {
            background-color: #f9fbfd;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            font-size: 14px;
            color: #1a73e8;
            border-left: 4px solid #1a73e8;
            padding-left: 8px;
            margin: 15px 0 8px 0;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .label {
            color: #666;
        }
        .val {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>실적 정보 상세 조회</h2>
        <div class="line"></div>
        <div class="input-group">
            <label>성함</label>
            <input type="text" id="userName" placeholder="이름 입력">
        </div>
        <div class="input-group">
            <label>생년월일</label>
            <input type="text" id="userBirth" placeholder="6자리 입력 (예: 820406)">

        <button onclick="search()">조회하기</button>
        <div id="result"></div>
    </div>

        {"n": "이은경", "b": "820602", "wd": 22, "m": 17208100, "mt": 25000000, "mp": "68.8%", "qt": 292, "qc": 128, "qp": "43.8%" },

        {"n": "최미란", "b": "870823", "wd": 19, "m": 45621900, "mt": 38400000, "mp": "118.8%", "qt": 513, "qc": 733, "qp": "142.8%" },

        ];

        function search() {
            const n = document.getElementById('userName').value.trim();
            const b = document.getElementById('userBirth').value.trim();
            const r = document.getElementById('result');
            const res = d.filter(u => u.n === n && u.b === b);

            if (res.length > 0) {
                r.style.display = 'block';
                let h = `<p style="text-align:center; font-size:12px; color:#888;">총 ${res.length}건 조회됨</p>`;
                
                res.forEach((u, i) => {
                    h += `
                        <div class="card">
                            <div style="font-weight:bold; text-align:center; margin-bottom:10px;">데이터 내역 #${i + 1}</div>
                            <div class="section-title">📊 매출 실적</div>
                            <div class="data-row"><span class="label">근무일수</span><span class="val">${u.wd}일</span></div>
                            <div class="data-row"><span class="label">실적</span><span class="val">${u.m.toLocaleString()}원</span></div>
                            <div class="data-row"><span class="label">타겟</span><span class="val">${u.mt.toLocaleString()}원</span></div>
                            <div class="data-row"><span class="label">달성율</span><span class="val" style="color:#1a73e8">${u.mp}</span></div>
                            
                            <div class="section-title">📦 품목 실적</div>
                            <div class="data-row"><span class="label">수량</span><span class="val">${u.qc}개</span></div>
                            <div class="data-row"><span class="label">타겟</span><span class="val">${u.qt}개</span></div>
                            <div class="data-row"><span class="label">달성율</span><span class="val" style="color:#1a73e8">${u.qp}</span></div>
                        </div>`;
                });
                r.innerHTML = h;
            } else {
                alert("일치하는 정보가 없습니다.");
                r.style.display = 'none';
            }
        }
    </script>
</body>
</html>
