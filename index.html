<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출 실적 조회 시스템</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; padding: 20px; background-color: #f0f2f5; color: #1c1e21; line-height: 1.6; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 30px; font-size: 24px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #4b4b4b; }
        input { width: 100%; padding: 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
        input:focus { border-color: #1a73e8; outline: none; }
        button { width: 100%; padding: 16px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 30px; }
        .record-card { background: #f8f9fa; padding: 20px; border-radius: 12px; border-left: 6px solid #1a73e8; margin-bottom: 20px; }
        .record-card p { margin: 8px 0; font-size: 15px; display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding-bottom: 4px; }
        .record-card p b { color: #333; }
        .highlight { color: #d93025; font-weight: bold; font-size: 18px; }
        .summary-text { text-align: center; margin-bottom: 15px; font-weight: bold; color: #5f6368; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 개인 실적 상세 조회</h2>
    <div class="input-group">
        <label>성함</label>
        <input type="text" id="userName" placeholder="이름 입력">
    </div>
    <div class="input-group">
        <label>생년월일</label>
        <input type="text" id="userBirth" placeholder="6자리 (예: 811005)">
    </div>
    <button onclick="searchData()">실적 데이터 불러오기</button>

    <div id="result"></div>
</div>

        { name: "김정희", birth: "670720", days: 17, sales: "12,932,522", target: "16,400,000", rate: "78.9%", itemQty: 145, itemRate: "92.4%" },
        { name: "이혜정", birth: "690115", days: 17, sales: "14,268,361", target: "14,850,000", rate: "96.1%", itemQty: 77, itemRate: "50.3%" },

        { name: "정인지", birth: "810506", days: 17, sales: "17,520,164", target: "17,550,000", rate: "99.8%", itemQty: 262, itemRate: "134.4%" },
        { name: "황국화", birth: "780717", days: 5, sales: "6,956,666", target: "7,250,000", rate: "96.0%", itemQty: 67, itemRate: "100.0%" },
        { name: "최미란", birth: "870823", days: 85, sales: "104,940,386", target: "109,850,000", rate: "95.5%", itemQty: 1394, itemRate: "119.2%" },
        { name: "김은미", birth: "711027", days: 16, sales: "16,718,093", target: "16,600,000", rate: "100.7%", itemQty: 67, itemRate: "44.4%" },
        { name: "김주영", birth: "781208", days: 17, sales: "19,649,061", target: "18,200,000", rate: "108.0%", itemQty: 109, itemRate: "60.2%" },
        { name: "최민경", birth: "850813", days: 16, sales: "16,302,058", target: "17,600,000", rate: "92.6%", itemQty: 86, itemRate: "53.8%" },
        { name: "최순정", birth: "680223", days: 16, sales: "17,291,290", target: "16,400,000", rate: "105.4%", itemQty: 94, itemRate: "49.2%" },
        { name: "황미현", birth: "831221", days: 16, sales: "14,016,797", target: "15,030,000", rate: "93.3%", itemQty: 77, itemRate: "50.0%" },
        { name: "권혜윤", birth: "701011", days: 6, sales: "3,611,201", target: "5,900,000", rate: "61.2%", itemQty: 32, itemRate: "41.6%" },
        { name: "김민주", birth: "751016", days: 9, sales: "6,278,222", target: "8,400,000", rate: "74.7%", itemQty: 31, itemRate: "39.7%" },

        { name: "박서윤", birth: "991204", days: 8, sales: "4,797,121", target: "7,200,000", rate: "66.6%", itemQty: 17, itemRate: "26.6%" },

        { name: "이은심", birth: "811005", days: 15, sales: "17,147,411", target: "24,200,000", rate: "70.9%", itemQty: 242, itemRate: "93.1%" },
        { name: "김은미", birth: "711027", days: 16, sales: "16,718,093", target: "16,600,000", rate: "100.7%", itemQty: 67, itemRate: "44.4%" },
        { name: "정인지", birth: "810506", days: 17, sales: "17,520,164", target: "17,550,000", rate: "99.8%", itemQty: 262, itemRate: "134.4%" }
    ];

    function searchData() {
        const name = document.getElementById('userName').value.trim();
        const birth = document.getElementById('userBirth').value.trim();
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML = "";

        if(!name || !birth) {
            alert("이름과 생년월일을 정확히 입력해주세요.");
            return;
        }

        const matches = data.filter(p => p.name === name && p.birth === birth);

        if (matches.length > 0) {
            let html = `<div class="summary-text">총 ${matches.length}건의 실적이 조회되었습니다.</div>`;
            matches.forEach((item, index) => {
                html += `
                    <div class="record-card">
                        <p><span>조회 대상</span> <b>${item.name} (${item.birth})</b></p>
                        <p><span>근무 일수</span> <b>${item.days}일</b></p>
                        <p><span>매출액</span> <b>${item.sales}원</b></p>
                        <p><span>목표액</span> <b>${item.target}원</b></p>
                        <p><span>매출 달성률</span> <span class="highlight">${item.rate}</span></p>
                        <p><span>품목 판매량</span> <b>${item.itemQty}건</b></p>
                        <p><span>품목 달성률</span> <b>${item.itemRate}</b></p>
                    </div>
                `;
            });
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = "<p style='text-align:center; color:#ff4d4f;'>일치하는 정보를 찾을 수 없습니다.</p>";
        }
    }
</script>

</body>
</html>
