            background-color: #1a73e8;
            border-radius: 2px;
            margin-bottom: 30px;
        }
        .input-group {

        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {

            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {

            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;

        #result {

        .card {

            color: #1a73e8;

        .data-row {
